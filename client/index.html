<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortner</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.7.0/styles/webawesome.css" />
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.7.0/webawesome.loader.js"></script>
<script defer src="main.js"></script>
<script defer src="popup.js"></script>

<style>
body {
    margin: 0;
}

.typewriter {
    overflow: hidden;
    white-space: nowrap;
    border-right: 2px solid white;
    display: inline-block;
    width: 0;
}

.no-cursor {
    border-right: none !important;
}

#title {
    animation: typingTitle 1.5s steps(12, end) forwards, blink 0.7s infinite;
}

#subtitle {
    opacity: 0;
    animation:
        typingSubtitle 1.5s steps(25, end) 1.7s forwards,
        blink 0.7s infinite;
}

@keyframes typingTitle {
    from { width: 0; }
    to { width: 12ch; }
}

@keyframes typingSubtitle {
    from { width: 0; opacity: 1; }
    to { width: 28ch; opacity: 1; }
}

@keyframes blink {
    50% { border-color: transparent; }
}
</style>
</head>

<body id="page" class="bg-[#1c1c1c] flex flex-col justify-center items-center min-h-screen font-mono px-6 sm:px-10">

<h1 id="title" class="text-white text-5xl font-bold typewriter text-center">
    URL Shortner
</h1>

<h2 id="subtitle" class="text-gray-500 text-2xl pb-12 typewriter text-center">
    By <a id="authorLink" href="https://www.google.com" class="underline">Ayan Mehmood</a>
</h2>

<div id="inputBox" class="flex items-center gap-2 opacity-0 translate-y-[-20px]">

    <input
        id="urlInput"
        placeholder="Enter URL Here"
        type="text"
        class="bg-[#525252] rounded-full shadow-md h-12 w-72 px-4 text-white outline-none transition focus:bg-white focus:text-black"
    >

    <button id="submitBtn" class="bg-white rounded-full h-12 w-12 flex items-center justify-center shadow-md hover:bg-gray-200 transition-transform duration-150 active:scale-75">
        
        <wa-icon id="submitIcon" name="arrow-right-to-bracket" style="color: black;"></wa-icon>
    
    </button>

</div>

<div id="footer" class="flex items-center justify-center gap-2 fixed bottom-0 left-0 w-full p-3 text-white backdrop-blur">

    <wa-icon id="githubIcon" name="github" family="brands" style="color: white;"></wa-icon>

    <a id="sourceLink" href="https://www.google.com">View Source Code Here</a>

</div>

<script>
window.addEventListener("load", () => {

    setTimeout(() => {
        document.getElementById("title").classList.add("no-cursor");
        document.getElementById("subtitle").classList.add("no-cursor");
    }, 3200);

    setTimeout(() => {
        const box = document.getElementById("inputBox");
        box.style.transition = "0.6s ease";
        box.style.opacity = "1";
        box.style.transform = "translateY(0)";
    }, 2000);

});
</script>

</body>
</html>
